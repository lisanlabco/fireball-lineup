<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fireball 2026 使用統計</title>
<style>
body{margin:0;padding:16px;font-family:"Noto Sans TC",system-ui,sans-serif;color:#2a1d14;background:#9fd6f0;background-image:radial-gradient(rgba(255,255,255,.38) 1.3px,transparent 1.5px);background-size:9px 9px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.c{background:#fff;border:3px solid #2a1d14;border-radius:16px;box-shadow:3px 4px 0 #2a1d14;padding:12px}
.c b{display:block;font-size:12px}
.n{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
td{padding:8px 4px;border-bottom:1px dashed rgba(42,29,20,.2);vertical-align:top;font-size:14px}
td:first-child{width:28px;font-weight:900}
td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
small{color:#5a5048}
button{margin-top:12px;border:3px solid #2a1d14;background:#ffd23f;border-radius:12px;padding:8px 16px;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #2a1d14}
p{font-size:12px;color:#5a5048;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fireball 2026 使用統計</h1>
  <div class="grid">
    <div class="c"><b>使用過的手機</b><div class="n" id="dev">…</div></div>
    <div class="c"><b>今天打開過</b><div class="n" id="today">…</div></div>
    <div class="c"><b>訂閱行事曆</b><div class="n" id="subs">…</div></div>
    <div class="c"><b>按了分享</b><div class="n" id="shares">…</div></div>
    <div class="c"><b>朋友分享帶進來</b><div class="n" id="via">…</div></div>
  </div>
  <div class="c"><b>熱門場次</b><table id="top"></table></div>
  <button id="re">重新整理</button>
  <p id="at"></p>
  <p>以手機為單位計算。同一個人換手機或清除瀏覽資料，會算成新的一支。熱門場次依每支手機目前選的場次統計。「按了分享」包含分享按鈕和複製 lineup；「朋友分享帶進來」是點分享連結第一次打開網站的手機數，從 11/12 中午開始記錄。</p>
</div>
<script>
const GAS = 'https://script.google.com/macros/s/AKfycbze3cX_TOB64N49ZPMYjqyikP9Z5uX9ass7c4SYIlSrjVXNNBJjbKbMa6Vq4C14YZe9/exec';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  document.getElementById('at').textContent = '讀取中…';
  try {
    const d = await (await fetch(GAS + '?stats=1&t=' + Date.now())).json();
    document.getElementById('dev').textContent = d.devices;
    document.getElementById('today').textContent = d.today;
    document.getElementById('subs').textContent = d.subs;
    document.getElementById('shares').textContent = d.shares ?? 0;
    document.getElementById('via').textContent = d.viaShare ?? 0;
    document.getElementById('top').innerHTML = d.top.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.t)}<br><small>${x.d.slice(5).replace('-', '/')} ${x.s}</small></td><td>${x.n}</td></tr>`).join('') || '<tr><td></td><td>還沒有人選場次</td><td></td></tr>';
    document.getElementById('at').textContent = '更新時間 ' + new Date(d.at).toLocaleString('zh-TW', {timeZone: 'Asia/Taipei', hour12: false});
  } catch (e) {
    document.getElementById('at').textContent = '讀取失敗，稍後再按重新整理';
  }
}
document.getElementById('re').onclick = load;
load();
</script>
</body>
</html>
